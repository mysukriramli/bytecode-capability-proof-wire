name: Bytecode Capability Proof Engine

on:
  schedule:
    - cron: '43 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: capability-proof-compile
  cancel-in-progress: true

jobs:
  analyze-and-publish:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore DuckDB Database Cache
        uses: actions/cache@v4
        with:
          path: data/capabilities.db
          key: capability-db-${{ github.run_id }}
          restore-keys: |
            capability-db-

      - name: Execute Bytecode Capability Engine
        run: python capability_engine.py

      - name: Commit Historical Ledger and Lineage
        run: |
          git config user.name "capability-bot[bot]"
          git config user.email "capability-bot@users.noreply.github.com"

          # Stage ledger, parquet, and generated public API payloads
          git add ledger/ data/capabilities.parquet public/

          if git diff --staged --quiet; then
            echo "No capability roots or upgrades to commit."
          else
            git commit -m "chore(capabilities): record EVM capability roots and proxy lineage [skip ci]"
            git pull --rebase --autostash origin main
            git push origin main
          fi

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Artifacts to Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'public/'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
