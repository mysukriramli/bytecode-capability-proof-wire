name: Bytecode Capability Proof Engine

on:
  schedule:
    - cron: "43 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: capability-proof-compile
  cancel-in-progress: true

jobs:
  analyze-and-publish:
    runs-on: ubuntu-24.04

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip

          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      - name: Restore DuckDB Database Cache
        uses: actions/cache@v4
        with:
          path: data/capabilities.db
          key: capability-db-${{ github.run_id }}
          restore-keys: |
            capability-db-

      - name: Execute Bytecode Capability Engine
        run: |
          python capability_engine.py

      - name: Commit Historical Ledger and Lineage
        run: |
          git config user.name "capability-bot[bot]"
          git config user.email "capability-bot@users.noreply.github.com"

          mkdir -p ledger
          mkdir -p data
          mkdir -p public

          git add ledger/ || true
          git add data/capabilities.parquet || true
          git add public/ || true

          if git diff --staged --quiet; then
            echo "No capability roots or upgrades to commit."
          else
            git commit -m "chore(capabilities): record EVM capability roots and proxy lineage [skip ci]"
            git pull --rebase --autostash origin main
            git push origin main
          fi

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Ensure Pages Output Exists
        run: |
          mkdir -p public

          touch public/.nojekyll

          if [ ! -f public/index.html ]; then
            echo '<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bytecode Capability Proof Engine</title></head><body><h1>Bytecode Capability Proof Engine</h1><p>Deployment Active</p></body></html>' > public/index.html
          fi

      - name: Verify Generated Site
        run: |
          echo "===== PUBLIC DIRECTORY ====="
          ls -lah public

          echo ""
          echo "===== FILES ====="
          find public -type f

          echo ""
          echo "===== INDEX PREVIEW ====="
          head -n 20 public/index.html || true

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Save Updated Database Cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/capabilities.db
          key: capability-db-${{ github.run_id }}
